spring.application.name=trazamar-backend

# Puerto del servidor. El emulador Android lo ve como http://10.0.2.2:8080
server.port=8080

# ---------- Base de datos SQLite ----------
# El archivo trazamar.db se crea solo en la carpeta del proyecto la primera vez
spring.datasource.url=jdbc:sqlite:trazamar.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite trabaja mejor con una sola conexión a la vez
spring.datasource.hikari.maximum-pool-size=1

# ---------- JPA / Hibernate ----------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update = crea las tablas si no existen y agrega columnas nuevas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
